# ---------------------------------------------------------------------------
# Training defaults (LoRA fine-tuning, run on SageMaker)
# ---------------------------------------------------------------------------
training:
  epochs: 6
  batch_size: 8                       # per-device (single-GPU instances)
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler: cosine
  optimizer: adamw_torch
  precision: bf16
  max_seq_length: 2048
  max_grad_norm: 1.0
  seeds: [42]
  n_checkpoints: 1
  n_evals: 0
  train_on_inputs: auto


# ---------------------------------------------------------------------------
# LoRA defaults
# ---------------------------------------------------------------------------
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]


# ---------------------------------------------------------------------------
# Inference defaults (SageMaker-hosted open-source models).
# API models specify their inference parameters inside their own model block.
# ---------------------------------------------------------------------------
inference:
  target_tokens: ["Yes", "No"]
  precision: bf16
  max_seq_length: 2048
  max_total_tokens: 4096                  # TGI MAX_TOTAL_TOKENS
  max_batch_prefill_tokens: 4096          # TGI MAX_BATCH_PREFILL_TOKENS
  temperature: 1.0
  max_tokens: 512                         # binary Yes/No logit pass: only need first-token logprobs
  logprobs: true
  logprobs_top_k: 5
  device_map: auto                        # custom-handler path only
  model_server_workers: 1                 # custom-handler path; 1 lets device_map=auto shard once


# ---------------------------------------------------------------------------
# SageMaker defaults (training jobs + real-time inference endpoints).
# AWS credentials, the execution role ARN, and the Hub username under which
# fine-tuned models are pushed are read from environment (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION / SM_ROLE_ARN / HF_USERNAME via
# src/utils/config.py) -- only non-secret runtime knobs live here.
# ---------------------------------------------------------------------------
sagemaker:
  # Pinned training DLC (HF PyTorch GPU). Bump in lockstep with the SDK.
  training_image_uri:
    "763104351884.dkr.ecr.{region}.amazonaws.com/huggingface-pytorch-training:2.9.0-transformers5.3.0-gpu-py312-cu130-ubuntu22.04"
  training_py_version: py312
  max_run_seconds: 36000              # 10h training cap
  s3_prefix: synthetic-rct            # under sagemaker default bucket
  endpoint_startup_timeout: 900       # 15m TGI cold-start budget


# ---------------------------------------------------------------------------
# Train/test split defaults (applies to RCTs; surveys are train-only)
# ---------------------------------------------------------------------------
split:
  method: subject_holdout
  test_fraction: 0.2
  stratify_by: treatment


# ===========================================================================
# Models
#
# `base_model` is the model's repo on the Hugging Face Hub. SageMaker uses
# it both as the starting point for LoRA fine-tuning and (for the `instruct`
# condition) as the HF_MODEL_ID the TGI container pulls at endpoint start.
#
# `training_instance_type` / `inference_instance_type` pick the SageMaker
# instance for fine-tuning and for the served endpoint respectively. Sized
# per model so 8B variants run on ~24GB GPUs while 70B variants get
# multi-GPU boxes.
# ===========================================================================
models:

  # --- Open-source models: fine-tuned with LoRA, inference via logit pass ---
  llama_8b:
    base_model: meta-llama/Llama-3.1-8B-Instruct
    family: llama
    type: open
    training_instance_type: ml.g6e.2xlarge   # 1x L40S 48GB
    inference_instance_type: ml.g5.2xlarge   # 1x A10G 24GB
    inference_num_shard: 1

  llama_8b_base:
    base_model: meta-llama/Llama-3.1-8B
    family: llama
    type: open
    training_instance_type: ml.g6e.2xlarge
    inference_instance_type: ml.g5.2xlarge
    inference_num_shard: 1

  llama_70b:
    base_model: meta-llama/Llama-3.1-70B-Instruct
    family: llama
    type: open
    training_instance_type: ml.p4d.24xlarge  # 8x A100 40GB
    inference_instance_type: ml.g5.48xlarge  # 8x A10G 24GB
    inference_num_shard: 8                   # tensor-parallel across all 8 A10G
    training:
      batch_size: 1                    # 8 GPUs * 1 per-device * 1 accum = effective 8
      fsdp: true                       # 70B weights (140GB) don't fit per-GPU; shard via FSDP
      gradient_checkpointing: true     # required for activations to fit alongside FSDP shard
    lora:                              # 70B benefits from MLP modules
      target_modules: [q_proj, k_proj, v_proj, o_proj,
                       gate_proj, up_proj, down_proj]

  qwen_8b:
    base_model: Qwen/Qwen3-8B
    family: qwen
    type: open
    training_instance_type: ml.g6e.2xlarge
    inference_instance_type: ml.g5.2xlarge
    inference_num_shard: 1

  qwen_70b:
    base_model: Qwen/Qwen3-70B
    family: qwen
    type: open
    training_instance_type: ml.p4d.24xlarge
    inference_instance_type: ml.g5.48xlarge
    inference_num_shard: 8                   # tensor-parallel across all 8 A10G
    training:
      batch_size: 1                    # 8 GPUs * 1 per-device * 1 accum = effective 8
      fsdp: true                       # 70B weights don't fit per-GPU; shard via FSDP
      gradient_checkpointing: true     # required for activations to fit alongside FSDP shard

  olmo2_7b:
    base_model: allenai/OLMo-2-1124-7B-Instruct
    family: olmo2
    type: open
    training_instance_type: ml.g6e.2xlarge
    inference_instance_type: ml.g5.2xlarge
    inference_num_shard: 1

  olmo2_32b:
    base_model: allenai/OLMo-2-0325-32B-Instruct
    family: olmo2
    type: open
    training_instance_type: ml.g6e.12xlarge  # 4x L40S 48GB
    inference_instance_type: ml.g5.48xlarge  # 8x A10G 24GB; 8-way TP shards weights to ~8GB/GPU
    inference_num_shard: 8                   # tensor-parallel across all 8 A10G
    training:
      batch_size: 2                    # 4 GPUs * 2 per-device * 1 accum = effective 8
      fsdp: true                       # 32B weights (64GB) don't fit per-GPU; shard via FSDP
      gradient_checkpointing: true     # required for activations to fit alongside FSDP shard

  # --- API model: inference-only, no fine-tuning, no SageMaker. ---
  gpt5:
    api_model: "TBD"
    type: api
    inference:                         # API parameters replace open-model defaults
      temperature: 0.0
      seed: 42
      max_tokens: 5


# ===========================================================================
# Experimental conditions
# `instruct` = off-the-shelf instruct variant, no tuning.
# `finetuned` = LoRA fine-tune on RCT training splits.
# Open models are evaluated in both conditions; API models in `instruct` only.
# ===========================================================================
conditions: [instruct, finetuned]


